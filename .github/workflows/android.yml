name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM core modules)
        run: ./gradlew --stacktrace :core:model:test :core:common:test :core:provider:test :core:domain:test

      - name: Build debug APK
        run: ./gradlew --continue assembleDebug

      - name: Unit tests (Android modules)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omniai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  release:
    # Signed release build, only when signing secrets are configured (see docs/SIGNING.md).
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.OMNIAI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: Build signed release
        if: env.HAS_KEYSTORE == 'true'
        env:
          OMNIAI_KEYSTORE_BASE64: ${{ secrets.OMNIAI_KEYSTORE_BASE64 }}
          OMNIAI_KEYSTORE_PASSWORD: ${{ secrets.OMNIAI_KEYSTORE_PASSWORD }}
          OMNIAI_KEY_ALIAS: ${{ secrets.OMNIAI_KEY_ALIAS }}
          OMNIAI_KEY_PASSWORD: ${{ secrets.OMNIAI_KEY_PASSWORD }}
        run: |
          echo "$OMNIAI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export OMNIAI_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --stacktrace assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload release artifacts
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omniai-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Skip notice
        if: env.HAS_KEYSTORE != 'true'
        run: echo "Signing secrets not configured; skipping signed release build."

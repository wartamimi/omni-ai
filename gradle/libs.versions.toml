[versions]
# Build toolchain (verified against official release notes, Nov 2026)
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
# AndroidX
androidxActivity = "1.13.0"
androidxCore = "1.19.1"
androidxCoreSplashscreen = "1.2.0"
androidxLifecycle = "2.11.1"
androidxNavigation = "2.10.2"
androidxRoom = "2.8.5"
androidxDataStore = "1.3.0"
androidxWork = "2.12.0"
androidxHilt = "1.4.0"
androidxBiometric = "1.1.0"
composeBom = "2026.09.00"
# Networking / serialization
okhttp = "5.5.1"
kotlinxSerialization = "1.13.0"
kotlinxCoroutines = "1.11.0"
coil = "3.6.3"
markdownRenderer = "0.46.0"
pdfbox = "2.0.27.0"
# Testing
junit4 = "4.13.2"
turbine = "1.2.1"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
